<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1B2A4A">
    <title>Reset Password — LIU Clubs</title>
    <link rel="icon" href="/static/liu-logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">
    <div class="auth-split">

        <div class="auth-left">
            <div class="auth-left-content">
                <div class="auth-left-logo">
                    <img src="/static/liu-bg.png" alt="LIU" class="auth-left-logo-img">
                </div>
                <p>Connect · Grow · Belong</p>
                <div class="auth-left-bar"></div>
                <div class="auth-features">
                    <div class="auth-feature-card">
                        <span class="af-icon"><i data-lucide="key"></i></span>
                        <div>
                            <div class="af-title">Strong Password</div>
                            <div class="af-desc">At least 6 characters</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="auth-right">
            <div class="auth-form-wrap">
                <div class="auth-mobile-top">
                    <img src="/static/liu-bg.png" alt="LIU" class="auth-mobile-logo">
                    <span class="auth-mobile-tagline">Connect · Grow · Belong</span>
                </div>
                <h2>New Password</h2>
                <p class="auth-subtitle">Choose a new password for your account</p>

                {% if error %}
                <div class="flash error">{{ error }}</div>
                {% endif %}

                {% if token %}
                <form method="POST" action="/reset-password/{{ token }}">
                    <div class="form-group">
                        <label>New Password</label>
                        <div class="pw-wrap">
                            <input type="password" name="password" required placeholder="••••••••" autofocus>
                            <button type="button" class="pw-toggle" onclick="togglePw(this)" aria-label="Show password"><i data-lucide="eye"></i></button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <div class="pw-wrap">
                            <input type="password" name="confirm_password" required placeholder="••••••••">
                            <button type="button" class="pw-toggle" onclick="togglePw(this)" aria-label="Show password"><i data-lucide="eye"></i></button>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary full-width">Set New Password</button>
                </form>
                {% endif %}

                <div class="auth-links">
                    <a href="/login">Back to Sign In</a>
                </div>
            </div>
        </div>

    </div>
    <script src="/static/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide/dist/umd/lucide.min.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
